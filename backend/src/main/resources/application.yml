spring:
  application:
    name: projeto-lastro
  datasource:
    url: ${LASTRO_DATABASE_URL:jdbc:postgresql://localhost:5432/lastro}
    username: ${LASTRO_DATABASE_USER:lastro}
    password: ${LASTRO_DATABASE_PASSWORD:lastro}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  ai:
    mcp:
      server:
        name: projeto-lastro
        version: 0.1.0
        protocol: STATELESS
        instructions: Ferramentas somente leitura para consultar especificações e prontidão de release.

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

lastro:
  security:
    api-key: ${LASTRO_API_KEY:local-development-key}

server:
  shutdown: graceful
