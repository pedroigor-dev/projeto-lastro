services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lastro
      POSTGRES_USER: lastro
      POSTGRES_PASSWORD: lastro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastro -d lastro"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - lastro-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      LASTRO_DATABASE_URL: jdbc:postgresql://database:5432/lastro
      LASTRO_DATABASE_USER: lastro
      LASTRO_DATABASE_PASSWORD: lastro
      LASTRO_API_KEY: local-development-key
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  lastro-data:
