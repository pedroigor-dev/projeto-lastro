services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vertex
      POSTGRES_USER: vertex
      POSTGRES_PASSWORD: vertex
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vertex -d vertex"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - vertex-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      VERTEX_DATABASE_URL: jdbc:postgresql://database:5432/vertex
      VERTEX_DATABASE_USER: vertex
      VERTEX_DATABASE_PASSWORD: vertex
      VERTEX_API_KEY: local-development-key
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  vertex-data:
